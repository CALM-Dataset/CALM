name: Docker image

on:
  workflow_call:
    inputs:
      timesteps:
        type: string
        default: "50000"
  workflow_dispatch:
    inputs:
      timesteps:
        type: string
        default: "50000"

permissions:
  contents: read

jobs:
  build-and-run:
    name: Build the image, train and evaluate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TIMESTEPS: ${{ inputs.timesteps || '50000' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: calm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tests inside the image
        run: docker run --rm calm:ci pytest -q

      - name: Train
        run: |
          docker run --name trainer calm:ci \
            calm train --algo PPO --run-name ci --timesteps "$TIMESTEPS" --n-envs 2

      - name: Evaluate the trained model on one scenario
        run: |
          docker commit trainer calm:trained
          docker run --rm calm:trained calm eval ci --scenario c

      - name: Evaluate a scenario suite
        run: docker run --rm calm:trained calm eval ci --suites 01_single_bump --n-episodes 2

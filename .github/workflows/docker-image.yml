name: Docker image

on:
  workflow_call:
    inputs:
      timesteps:
        type: string
        default: "50000"
  workflow_dispatch:
    inputs:
      timesteps:
        type: string
        default: "50000"

permissions:
  contents: read
  packages: write

jobs:
  build-and-run:
    name: Reuse or build the image, train and evaluate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TIMESTEPS: ${{ inputs.timesteps || '512' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Reuse the image if its dependencies are unchanged, otherwise build it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPS_KEY: ${{ hashFiles('Dockerfile', 'requirements.txt', 'pyproject.toml') }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/calm-ci:deps-${DEPS_KEY}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin || true
          if docker pull "$IMAGE"; then
            echo "reusing $IMAGE"
            echo "Image reused: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          else
            docker build --target deps --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" -t "$IMAGE" .
            if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
              docker push "$IMAGE" || echo "image not pushed (no package access)"
            fi
            echo "Image built: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          docker tag "$IMAGE" calm:ci

      - name: Run the tests on the checked-out code
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace --user "$(id -u):$(id -g)" -e HOME=/tmp \
            calm:ci pytest -q

      - name: Train
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace --user "$(id -u):$(id -g)" -e HOME=/tmp \
            calm:ci sh -c 'python -m calm gen-scenes && python -m calm train --algo PPO --run-name ci --timesteps "$0" --n-envs 2' "$TIMESTEPS"

      - name: Evaluate the trained model on one scenario
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace --user "$(id -u):$(id -g)" -e HOME=/tmp \
            calm:ci python -m calm eval ci --scenario c

      - name: Evaluate a scenario suite
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace --user "$(id -u):$(id -g)" -e HOME=/tmp \
            calm:ci python -m calm eval ci --suites 01_single_bump --n-episodes 2

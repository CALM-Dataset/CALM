[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "CALM"
version = "0.1.0"
description = "Comfort-aware reinforcement-learning speed planner for a half-car or quarter-car over speed bumps"
license = "MIT"
authors = [{ name = "Mohammed El Said Azab Abdelazim" }]
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29.0,<1.1",
    "stable-baselines3>=2.3.0,<3.0",
    "torch>=2.0.0,<3.0",
    "safetensors>=0.4.0,<1.0",
    "numpy>=1.24.0,<3.0",
    "scipy>=1.11.0,<2.0",
    "matplotlib>=3.7.0,<4.0",
    "pyyaml>=6.0,<7.0",
    "numba>=0.59.0,<0.70",
    "optuna>=3.0.0,<5.0",
    "tensorboard>=2.14.0,<3.0",
    "tqdm>=4.65.0,<5.0",
    "rich>=13.0.0,<15.0",
    "pygame>=2.5.0,<3.0",
    "huggingface_hub>=0.24.0,<2.0",
]

[project.scripts]
calm = "calm.cli:main"

[project.optional-dependencies]
dev = ["pyflakes>=3.2.0,<4.0", "pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


PPO:
  policy: MlpPolicy
  learning_rate: lin_3e-4_5e-5
  n_steps: 64
  batch_size: 128
  n_epochs: 4
  gamma: 1.0
  gae_lambda: 1.0
  clip_range: 0.2
  clip_range_vf: 0.2
  target_kl: 0.02
  normalize_advantage: true
  ent_coef: 0.3
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    ortho_init: true
    activation_fn: ReLU
    net_arch:
      pi: [256, 128]
      vf: [256, 256]

training:
  seed: 69
  total_timesteps: 20_000
  n_envs: 4
  n_eval_envs: 1
  eval_freq: 2_000
  n_eval_episodes: 30
  checkpoint_freq: 4_000
  norm_reward: true
  action_saturation_penalty: 0.0
  subproc: true


PPO:
  learning_rate:
    type: float_log
    low: 1.0e-5
    high: 1.0e-3      

  n_steps:
    type: categorical
    choices: [1024, 2048, 4096, 8192]

  batch_size:
    type: categorical
    choices: [64, 128, 256]

  n_epochs:
    type: int
    low: 5
    high: 20

  gamma:
    type: float
    low: 0.99
    high: 0.9999

  gae_lambda:
    type: float
    low: 0.90
    high: 0.99

  clip_range:
    type: categorical
    choices: [0.1, 0.2, 0.3]

  ent_coef:
    type: float_log
    low: 1.0e-8
    high: 1.0e-2

  vf_coef:
    type: float
    low: 0.3
    high: 0.9

  max_grad_norm:
    type: float
    low: 0.3
    high: 1.0

  n_units:
    type: categorical
    choices: [128, 256, 512]

defaults:
  timesteps_per_trial: 1_000_000
  n_eval_episodes:     10
  seed:                1000
  n_jobs:              1
  direction:           maximize
  use_curriculum:      false

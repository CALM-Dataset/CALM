# reward weights; pitch_arm in m, pitch_clip in rad/s^2
weights:
  Q_zBddot:         50.0
  Q_zWddot:         0.0
  Q_pitch:          0.0
  pitch_arm:        1.3
  pitch_clip:       30.0
  Q_a:              0.2
  Q_v:              1.0
  track_scale:      0.0
  Q_step:           0.0
  time_cost:        0.0
  wk_heave:         true
  rel_scale:        100.0
  rel_time_price:   0.0
  rel_min_cost:     1.0
  rel_frontier:     true
  rel_time_quad:    0.9
  w_jerk:           0.4
  w_action_smooth:  0.2

# gravity and vertical acceleration clips in m/s^2
vertical:
  g:           9.81
  heave_clip:  1.0e9
  wheel_clip:  1.0e9

# speeds in km/h, a_max in m/s^2
velocity:
  v_limit:     35.0
  v_min:       8.0
  v_hard_min:  5.0
  v_init_low:  8.0
  a_max:       5.0

# comfort acceleration of the baselines in m/s^2
eval:
  a_comfort:   2.0

# episode end: speed bounds in m/s, a_limit in m/s^2
terminal:
  bonus:          100.0
  penalty:       -250.0
  v_min:          0.0
  v_max:          18.1
  Q_t:            0.0
  a_limit:        5.0

# speed limit in km/h
traffic_rules:
  v_max:       50
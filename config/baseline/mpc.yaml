# MPC horizon in control steps
N: 75

# solver iteration limit
nlp_solver_max_iter: 50

# reward weight overrides; pitch_arm in m, pitch_clip in rad/s^2
weights:
  Q_zBddot: 50.0
  Q_zWddot: 0.5
  Q_pitch: 12.0
  pitch_arm: 1.3
  pitch_clip: 30.0
  Q_v: 1.0
  track_scale: 0.05
  Q_step: 0.0

# OCP cost weights, without units
ocp:
  Q_speed: 1.0
  R_accel: 3.0
  S_jerk: 6.0
  Q_terminal: 1.0

# speed overrides in km/h
velocity:
  v_min: 8.0
  v_hard_min: 8.0

# speed search per bump: x0 and pre_m in m, settle_s in s, dv in m/s
comfort_map:
  x0:         20.0
  pre_m:      2.0
  settle_s:   2.0
  max_steps:  10000
  dv:         0.25
  iso_weighted: false
  vehicle:
    k_S_scale: 1.06
    D_scale:   0.16
